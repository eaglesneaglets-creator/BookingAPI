# Local development: the Postgres that `config.settings.local` expects.
#
#     docker compose up -d db
#
name: booking-dev

services:
  db:
    image: postgres:16-alpine
    container_name: booking_db_local
    environment: {POSTGRES_USER: booking, POSTGRES_PASSWORD: booking, POSTGRES_DB: booking}
    ports: ["5434:5432"]
    volumes: [booking-db:/var/lib/postgresql/data]

volumes:
  booking-db:
